name: cat

on:
  schedule:
    # 00:00 UTC, D:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: cache
        run: |
          DATE=$(date +%Y%m%d)
          sed -i "s/&v=[0-9]*/\&v=$DATE/g" README.md

      - name: commit
        run: |
          DATE=$(date +%Y%m%d)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "cache $DATE" || exit 0
          git push
